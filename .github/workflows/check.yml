name: Check dashboard

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Code Quality & Build
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Run linter (ESLint)
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Verify Drizzle schema migration sync
        run: |
          npm run db:generate
          git diff --exit-code drizzle/

      - name: Run non-database test suite (Client & Server)
        run: npm test

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Build production bundle
        run: npm run build

  database:
    name: Database Migrations & Integration Tests
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
      DATABASE_URL: postgres://obliq:obliq@127.0.0.1:5432/obliq_invitations_test
      TEST_DATABASE_URL: postgres://obliq:obliq@127.0.0.1:5432/obliq_invitations_test
      DEV_AUTH_ID: dev-seed-user
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: obliq
          POSTGRES_PASSWORD: obliq
          POSTGRES_DB: obliq_invitations_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U obliq -d obliq_invitations_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests against PostgreSQL
        run: npm run test:db

      - name: Verify database seeding compatibility
        run: npm run db:seed
